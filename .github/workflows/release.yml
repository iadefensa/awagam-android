name: "Release"

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "Build and publish"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@v6

      # Catches a tag that disagrees with the version the build would produce
      - name: "Check tag against versionName"
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: "Restore signing key"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printenv KEYSTORE_BASE64 | base64 --decode > awagam-release.jks
          cat > keystore.properties <<PROPERTIES
          storeFile=awagam-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=awagam
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      # Unit tests run as part of assembleRelease
      - name: "Assemble release"
        run: ./gradlew assembleRelease

      # The distributed APK must carry the certificate registered for Android
      # developer verification, or it will not install once enforcement applies
      - name: "Verify signing certificate"
        env:
          EXPECTED: "0597ae6f8c8ce4e5ae289e0348d1a03d5b82789300bce0bd945068099c3d5105"
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          actual="$("$apksigner" verify --print-certs "app/build/outputs/apk/release/awagam-$version.apk" \
            | awk '/SHA-256 digest/ {print $NF}')"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "APK signed with $actual, expected $EXPECTED" >&2
            exit 1
          fi

      - name: "Collect release assets"
        run: |
          mkdir dist
          cp "app/build/outputs/apk/release/awagam-$version.apk" "dist/awagam-$version.apk"
          # Version-independent copy, so `releases/latest/download/awagam.apk` keeps working
          cp "dist/awagam-$version.apk" dist/awagam.apk
          cd dist && sha256sum ./*.apk > SHA256SUMS

      # Published as a draft, so the release notes get written before it goes out
      - name: "Create draft release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "AWAGAM $version" \
            --generate-notes \
            dist/awagam-"$version".apk dist/awagam.apk dist/SHA256SUMS

      - name: "Install fdroidserver"
        run: pipx install fdroidserver

      - name: "Restore F-Droid repository key"
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: printenv FDROID_KEYSTORE_BASE64 | base64 --decode > fdroid/keystore.p12

      # The branch does not exist yet before the first release
      - name: "Check out the published repository"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git clone --depth 1 --branch gh-pages "$remote" pages 2>/dev/null || {
            mkdir pages
            git -C pages init -b gh-pages -q
            git -C pages remote add origin "$remote"
          }

      - name: "Build the F-Droid index"
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        run: |
          mkdir -p fdroid/repo fdroid/metadata/com.awagam.android/en-US
          # Carry published APKs forward, so older versions stay installable
          cp pages/fdroid/repo/*.apk fdroid/repo/ 2>/dev/null || true
          cp "app/build/outputs/apk/release/awagam-$version.apk" fdroid/repo/
          cp -R fastlane/metadata/android/en-US/. fdroid/metadata/com.awagam.android/en-US/
          cd fdroid && fdroid update --pretty

      - name: "Publish the F-Droid repository"
        run: |
          rm -rf pages/fdroid/repo
          mkdir -p pages/fdroid
          cp -R fdroid/repo pages/fdroid/repo
          cd pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish AWAGAM $version"
          git push -q origin gh-pages

      - name: "Remove signing keys"
        if: always()
        run: rm -f awagam-release.jks keystore.properties fdroid/keystore.p12