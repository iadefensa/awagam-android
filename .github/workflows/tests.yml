name: "Build and tests"

on:
  push:
    branches: main
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@v6
      - name: "Run unit tests"
        run: ./gradlew testDebugUnitTest

  release-build:
    name: "Release build"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@v6
      # Exercises R8 and lintVitalRelease, which the debug build does not cover;
      # unsigned here, as signing keys stay out of CI
      - name: "Assemble release"
        run: ./gradlew assembleRelease