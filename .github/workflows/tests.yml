name: "Tests"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v6
      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@v6
      - name: "Run unit tests"
        run: ./gradlew testDebugUnitTest